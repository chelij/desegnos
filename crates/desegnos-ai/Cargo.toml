[package]
name = "desegnos-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
test-support = []

[dependencies]
bytes = "=1.12.1"
httpdate = "=1.0.3"
desegnos-core = { path = "../desegnos-core" }
desegnos-storage = { path = "../desegnos-storage" }
serde.workspace = true
serde_json.workspace = true
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
tokio = { version = "=1.53.3", default-features = false, features = ["sync", "time", "macros", "rt", "net", "io-util"] }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
sha2.workspace = true
uuid.workspace = true
ts-rs.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "=1.53.3", default-features = false, features = ["rt-multi-thread", "net", "io-util", "test-util"] }

[lints]
workspace = true
