[package]
name = "desegnos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cssparser = "=0.37.0"
base64 = "=0.22.1"
dom_query = "=0.28.0"
html5ever = "=0.39.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
quick-xml = "=0.42.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
ts-rs.workspace = true

lightningcss = { version = "=1.0.0-alpha.72", default-features = false }
swc_common = { version = "=26.0.0", default-features = false }
swc_ecma_ast = { version = "=29.0.2", default-features = false, features = ["serde-impl"] }
swc_ecma_parser = { version = "=46.1.1", default-features = false, features = ["stacker"] }
swc_html_ast = { version = "=26.0.0", default-features = false }
swc_html_parser = { version = "=26.1.0", default-features = false }

url = "=2.5.8"
diffy = "0.5"
# Slides, images and vector previews render directly from the element tree: glyph outlines are
# emitted as paths, so exported files never depend on an installed font.
ttf-parser = "0.25"
fontdb = "0.23"
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
tiny-skia = "0.11"
flate2 = "1"

[lints]
workspace = true

