[package]
name = "desegnos-desktop"
default-run = "desegnos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "desegnos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["portal-dialogs"]
custom-protocol = ["tauri/custom-protocol"]
# File dialogs use the desktop portal. rfd allows only one Linux backend, so native test builds
# turn defaults off and use in-process GTK dialogs: the guarded Xvfb display has no portal.
portal-dialogs = ["tauri-plugin-dialog/xdg-portal", "dep:zbus"]
gtk-dialogs = ["tauri-plugin-dialog/gtk3"]
native-tests = ["dep:tauri-plugin-wdio-webdriver", "desegnos-ai/test-support"]

[dependencies]
desegnos-core = { path = "../crates/desegnos-core" }
desegnos-storage = { path = "../crates/desegnos-storage" }
desegnos-ai = { path = "../crates/desegnos-ai" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2", default-features = false }
tauri-plugin-clipboard-manager = "=2.5.0"
open = { version = "=5.4.4", features = ["shellexecute-on-windows"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
semver = "1"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
tokio = { version = "=1.53.3", features = ["net", "rt", "sync", "time", "signal", "macros"] }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
time = { version = "=0.3.55", features = ["formatting"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"
# Asking the session bus whether the desktop portal is there. Same version as ashpd's.
zbus = { version = "5", optional = true }

[dev-dependencies]
desegnos-ai = { path = "../crates/desegnos-ai", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }
