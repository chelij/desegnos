[workspace]
members = ["crates/desegni-core", "crates/desegni-storage", "crates/desegni-ai", "src-tauri"]
default-members = ["crates/desegni-core", "crates/desegni-storage", "crates/desegni-ai"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

