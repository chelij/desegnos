[workspace]
members = ["crates/desegnos-core", "crates/desegnos-storage", "crates/desegnos-ai", "src-tauri"]
default-members = ["crates/desegnos-core", "crates/desegnos-storage", "crates/desegnos-ai"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Picture decoding, scaling and previews are far too slow unoptimised; keep them fast in
# debug builds and native tests too.
# Backtraces keep file and line numbers; dropping full variable info makes dev and test
# binaries several times smaller and faster to link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Release speed with debug assertions and line tables, for timing native workflows. Never shipped.
[profile.profiling]
inherits = "release"
debug-assertions = true
overflow-checks = false
strip = false
debug = "line-tables-only"

