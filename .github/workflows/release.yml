name: Release

# Pushing a vX.Y.Z tag builds installers for macOS, Windows and Linux, signs the update
# files, and publishes a GitHub release whose latest.json the in-app updater reads.
# The release stays a draft until every platform has uploaded, so the updater never
# sees a partial release. macOS and Windows builds are not code-signed yet.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Take the id from the create call: the release list can lag behind a new draft.
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          [ -n "$id" ] || id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Desegnos ${TAG#v}" \
            -f body="Test build. macOS and Windows installers are not code-signed yet." -F draft=true --jq .id)
          [ -n "$id" ] || { echo "::error::No release id for $TAG"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
    outputs:
      id: ${{ steps.create.outputs.id }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # rust-toolchain.toml pins the compiler; this installs it plus the build target.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          # The publish job writes latest.json once; parallel jobs editing it raced.
          includeUpdaterJson: false

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails unless every platform's signature is present, so a partial release never goes live.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          node scripts/updater-manifest.mjs sigs "$GITHUB_REPOSITORY" "$TAG" > latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
